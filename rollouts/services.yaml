apiVersion: v1
kind: Service
metadata:
  name: demo-stable
  namespace: progressive-delivery
spec:
  selector:
    app: demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: demo-canary
  namespace: progressive-delivery
spec:
  selector:
    app: demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
